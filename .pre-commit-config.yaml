repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: backend-lint
        name: backend lint (ruff, mypy)
        entry: make lint-backend
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint (eslint, prettier, tsc)
        entry: make lint-frontend
        language: system
        files: ^frontend/
        pass_filenames: false
