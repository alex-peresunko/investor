[project]
name = "investor-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-json-logger==4.2.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "respx==0.23.1",
    "ruff==0.17.4",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on Ukrainian text, whose Cyrillic letters RUF001 flags as look-alikes.
"tests/**" = ["RUF001"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette deprecation of httpx inside TestClient; nothing to act on until FastAPI switches.
    "ignore::DeprecationWarning:fastapi.testclient",
]
